<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Zuordnen" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Zuordnen – Verbinde und ordne zu fürs iPad" />
  <title>Zuordnen</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="app">
    <div id="bezel" aria-hidden="true"></div>
    <div id="portrait-shell">

    <!-- Start screen -->
    <section id="screen-home" class="screen active" aria-label="Start">
      <div class="home-card">
        <h1 class="app-title">Zuordnen</h1>
        <p class="app-sub">Verbinde mit dem Finger!</p>
        <div class="home-btns">
          <button type="button" class="big-btn" data-exercise="bonbons" aria-label="Bunte Bonbons">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 120 70" width="100%" height="100%">
                <g transform="translate(18,35)">
                  <polygon points="-22,0 -14,-8 -14,8" fill="#52B788"/>
                  <ellipse cx="0" cy="0" rx="14" ry="10" fill="#52B788"/>
                  <polygon points="22,0 14,-8 14,8" fill="#52B788"/>
                  <ellipse cx="-4" cy="-3" rx="4" ry="2.5" fill="#fff" opacity=".35"/>
                </g>
                <g transform="translate(60,35)">
                  <polygon points="-22,0 -14,-8 -14,8" fill="#E63946"/>
                  <ellipse cx="0" cy="0" rx="14" ry="10" fill="#E63946"/>
                  <polygon points="22,0 14,-8 14,8" fill="#E63946"/>
                  <ellipse cx="-4" cy="-3" rx="4" ry="2.5" fill="#fff" opacity=".35"/>
                </g>
                <g transform="translate(102,35)">
                  <polygon points="-22,0 -14,-8 -14,8" fill="#FFD60A"/>
                  <ellipse cx="0" cy="0" rx="14" ry="10" fill="#FFD60A"/>
                  <polygon points="22,0 14,-8 14,8" fill="#FFD60A"/>
                  <ellipse cx="-4" cy="-3" rx="4" ry="2.5" fill="#fff" opacity=".45"/>
                </g>
              </svg>
            </span>
            <span class="big-btn-label">Bunte Bonbons</span>
          </button>
          <button type="button" class="big-btn" data-exercise="schneemaenner" aria-label="Schneemänner">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 100 90" width="100%" height="100%">
                <circle cx="50" cy="62" r="22" fill="#F5F7FA" stroke="#CBD5E1" stroke-width="2"/>
                <circle cx="50" cy="38" r="15" fill="#F5F7FA" stroke="#CBD5E1" stroke-width="2"/>
                <ellipse cx="50" cy="18" rx="16" ry="10" fill="#E63946"/>
                <circle cx="50" cy="6" r="6" fill="#FFD60A"/>
                <rect x="34" y="22" width="32" height="8" rx="3" fill="#FFD60A"/>
                <path d="M35 42 Q50 50 65 42" fill="none" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
                <circle cx="44" cy="36" r="2" fill="#222"/>
                <circle cx="56" cy="36" r="2" fill="#222"/>
                <path d="M50 38 L58 40 L50 42 Z" fill="#FF8C42"/>
              </svg>
            </span>
            <span class="big-btn-label">Schneemänner</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Exercise screen -->
    <section id="screen-play" class="screen" aria-label="Übung" hidden>
      <header class="play-bar">
        <button type="button" id="btn-back" class="bar-btn" aria-label="Zurück">← Zurück</button>
        <h2 id="play-title" class="play-title">Übung</h2>
        <button type="button" id="btn-again" class="bar-btn" aria-label="Nochmal">Nochmal</button>
      </header>
      <div id="stage-wrap">
        <main id="stage" aria-label="Spielfläche">
          <div id="board"></div>
          <svg id="lines" class="lines-layer" aria-hidden="true"></svg>
          <svg id="draw-line" class="lines-layer" aria-hidden="true"></svg>
        </main>
      </div>
      <p id="hint" class="hint">Verbinde mit dem Finger!</p>
    </section>

    </div><!-- /#portrait-shell -->

    <!-- Celebration overlay -->
    <div id="celebrate" class="celebrate" hidden aria-live="polite">
      <div class="celebrate-card">
        <div class="celebrate-emoji" aria-hidden="true">🎉</div>
        <p class="celebrate-text">Super gemacht!</p>
        <div class="celebrate-actions">
          <button type="button" id="celebrate-again" class="big-btn small">Nochmal</button>
          <button type="button" id="celebrate-home" class="big-btn small secondary">Zurück</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=3" defer></script>
</body>
</html>
