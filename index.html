<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Zuordnen" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F5EFE0" />
  <meta name="description" content="Zuordnen – Verbinde und ordne zu fürs iPad" />
  <title>Zuordnen</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <div id="app">
    <div id="bezel" aria-hidden="true"></div>
    <div id="portrait-shell">

    <!-- Start screen -->
    <section id="screen-home" class="screen active" aria-label="Start">
      <div class="home-card">
        <h1 class="app-title">Zuordnen</h1>
        <p class="app-sub">Verbinde mit dem Finger!</p>
        <div class="home-btns">
          <button type="button" class="big-btn" data-exercise="bonbons" aria-label="Bunte Bonbons">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 120 70" width="100%" height="100%">
                <g transform="translate(18,35)">
                  <polygon points="-22,0 -14,-8 -14,8" fill="#52B788"/>
                  <ellipse cx="0" cy="0" rx="14" ry="10" fill="#52B788"/>
                  <polygon points="22,0 14,-8 14,8" fill="#52B788"/>
                </g>
                <g transform="translate(60,35)">
                  <polygon points="-22,0 -14,-8 -14,8" fill="#E63946"/>
                  <ellipse cx="0" cy="0" rx="14" ry="10" fill="#E63946"/>
                  <polygon points="22,0 14,-8 14,8" fill="#E63946"/>
                </g>
                <g transform="translate(102,35)">
                  <polygon points="-22,0 -14,-8 -14,8" fill="#FFD60A"/>
                  <ellipse cx="0" cy="0" rx="14" ry="10" fill="#FFD60A"/>
                  <polygon points="22,0 14,-8 14,8" fill="#FFD60A"/>
                </g>
              </svg>
            </span>
            <span class="big-btn-label">Bunte Bonbons</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="big-btn" data-exercise="schneemaenner" aria-label="Schneemänner">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 100 90" width="100%" height="100%">
                <circle cx="50" cy="62" r="22" fill="#F5F7FA" stroke="#CBD5E1" stroke-width="2"/>
                <circle cx="50" cy="38" r="15" fill="#F5F7FA" stroke="#CBD5E1" stroke-width="2"/>
                <ellipse cx="50" cy="18" rx="16" ry="10" fill="#E63946"/>
                <circle cx="50" cy="6" r="6" fill="#FFD60A"/>
                <path d="M35 42 Q50 50 65 42" fill="none" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
                <circle cx="44" cy="36" r="2" fill="#222"/>
                <circle cx="56" cy="36" r="2" fill="#222"/>
                <path d="M50 38 L58 40 L50 42 Z" fill="#FF8C42"/>
              </svg>
            </span>
            <span class="big-btn-label">Schneemänner</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="big-btn" data-exercise="tiere" aria-label="Tiere zum Stall">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 100 80" width="100%" height="100%">
                <ellipse cx="38" cy="48" rx="22" ry="14" fill="#FFB4A2"/>
                <circle cx="20" cy="42" r="11" fill="#FFB4A2"/>
                <ellipse cx="12" cy="44" rx="5" ry="3.5" fill="#E8897A"/>
                <polygon points="70,28 90,48 50,48" fill="#E63946"/>
                <rect x="54" y="48" width="32" height="22" fill="#F5E6D3" stroke="#8B5E3C" stroke-width="2"/>
                <rect x="64" y="54" width="12" height="16" fill="#E63946"/>
              </svg>
            </span>
            <span class="big-btn-label">Tiere zum Stall</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="big-btn" data-exercise="formen" aria-label="Formen zuordnen">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 110 70" width="100%" height="100%">
                <circle cx="22" cy="35" r="16" fill="#FF6B9D"/>
                <polygon points="55,14 72,58 38,58" fill="#2EC4B6"/>
                <polygon points="92,12 98,28 116,28 102,40 107,56 92,46 77,56 82,40 68,28 86,28" fill="#FFD60A" transform="translate(-12,0) scale(0.85)"/>
              </svg>
            </span>
            <span class="big-btn-label">Formen zuordnen</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="big-btn" data-exercise="socken" aria-label="Socken-Paare">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 100 80" width="100%" height="100%">
                <path d="M22 12 H40 Q46 12 46 18 V40 Q46 48 54 54 Q58 58 54 64 Q48 70 38 68 L24 66 Q16 64 16 56 V18 Q16 12 22 12Z" fill="#E63946"/>
                <path d="M24 24 H42 M22 32 H44 M24 40 H42" stroke="#fff" stroke-width="3" opacity=".7"/>
                <path d="M62 12 H80 Q86 12 86 18 V40 Q86 48 94 54 Q98 58 94 64 Q88 70 78 68 L64 66 Q56 64 56 56 V18 Q56 12 62 12Z" fill="#4361EE"/>
                <circle cx="68" cy="28" r="3" fill="#fff" opacity=".8"/>
                <circle cx="78" cy="36" r="3" fill="#fff" opacity=".8"/>
                <circle cx="70" cy="44" r="3" fill="#fff" opacity=".8"/>
              </svg>
            </span>
            <span class="big-btn-label">Socken-Paare</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="big-btn" data-exercise="zahlen" aria-label="Zahlen und Mengen">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 110 70" width="100%" height="100%">
                <rect x="6" y="10" width="48" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
                <circle cx="22" cy="28" r="7" fill="#FF8C42"/>
                <circle cx="38" cy="28" r="7" fill="#FF8C42"/>
                <circle cx="22" cy="46" r="7" fill="#FF8C42"/>
                <circle cx="38" cy="46" r="7" fill="#FF8C42"/>
                <circle cx="82" cy="35" r="24" fill="#FF8C42"/>
                <text x="82" y="44" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">4</text>
              </svg>
            </span>
            <span class="big-btn-label">Zahlen und Mengen</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
          <button type="button" class="big-btn" data-exercise="kleidung" aria-label="Kleidung zum Wetter">
            <span class="big-btn-art" aria-hidden="true">
              <svg viewBox="0 0 110 70" width="100%" height="100%">
                <path d="M18 22 Q32 8 46 22 L52 52 Q32 58 12 52 Z" fill="#4361EE"/>
                <ellipse cx="78" cy="28" rx="18" ry="10" fill="#94A3B8"/>
                <circle cx="68" cy="30" r="9" fill="#94A3B8"/>
                <circle cx="86" cy="26" r="11" fill="#64748B"/>
                <line x1="70" y1="44" x2="66" y2="58" stroke="#4361EE" stroke-width="3" stroke-linecap="round"/>
                <line x1="80" y1="46" x2="78" y2="60" stroke="#4361EE" stroke-width="3" stroke-linecap="round"/>
                <line x1="90" y1="44" x2="88" y2="56" stroke="#4361EE" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="big-btn-label">Kleidung zum Wetter</span>
            <span class="done-badge" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Exercise screen -->
    <section id="screen-play" class="screen" aria-label="Übung" hidden>
      <header class="play-bar">
        <button type="button" id="btn-back" class="bar-btn" aria-label="Zurück">← Zurück</button>
        <h2 id="play-title" class="play-title">Übung</h2>
        <button type="button" id="btn-again" class="bar-btn" aria-label="Nochmal">Nochmal</button>
      </header>
      <div id="stage-wrap">
        <main id="stage" aria-label="Spielfläche">
          <div id="board"></div>
          <svg id="lines" class="lines-layer" aria-hidden="true"></svg>
          <svg id="draw-line" class="lines-layer" aria-hidden="true"></svg>
        </main>
      </div>
      <p id="hint" class="hint">Verbinde mit dem Finger!</p>
    </section>

    </div><!-- /#portrait-shell -->

    <!-- Celebration overlay -->
    <div id="celebrate" class="celebrate" hidden aria-live="polite">
      <div class="celebrate-card">
        <img class="celebrate-sticker" src="icons/celebrate-check.png" width="160" height="160" alt="" aria-hidden="true">
        <p class="celebrate-text">Super gemacht!</p>
        <div class="celebrate-actions">
          <button type="button" id="celebrate-next" class="big-btn small primary">Nächstes Rätsel</button>
          <button type="button" id="celebrate-again" class="big-btn small">Nochmal</button>
          <button type="button" id="celebrate-home" class="big-btn small secondary">Zurück</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=13" defer></script>
</body>
</html>
